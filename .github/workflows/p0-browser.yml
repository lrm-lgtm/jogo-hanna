name: Casa Hanna - Browser E2E
on:
  push:
    branches: [feature/hanna-p0-interactions-controls-20261011]
  pull_request:
    paths:
      - 'tests/p0-browser.test.cjs'
      - '.github/workflows/p0-browser.yml'
      - 'src/**'
      - 'payload/**'
      - 'index.html'
jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the actual game locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hanna-http.log 2>&1 &
          echo $! > /tmp/hanna-http.pid
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hanna-http.log
          exit 1
      - name: Test actual controls and mission in Chromium
        run: node --test tests/p0-browser.test.cjs
      - name: Upload screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casa-hanna-p0-browser-evidence
          path: |
            artifacts/p0-browser/
            /tmp/hanna-http.log
          if-no-files-found: warn
          retention-days: 14
