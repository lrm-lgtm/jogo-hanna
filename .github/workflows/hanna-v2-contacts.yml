name: Hanna v2 R15 - fridge milk table physical interaction
on:
  push:
    branches: [feature/cozinha-3d-v2-20261022]
    paths:
      - 'v2/cozinha.js'
      - 'v2/interaction-anchors.js'
      - 'v2/tests/contacts.browser.cjs'
      - '.github/workflows/hanna-v2-contacts.yml'
  workflow_dispatch:
jobs:
  browser-contacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check actual game and reachable contact targets
        run: |
          node --check v2/cozinha.js
          node --check v2/interaction-anchors.js
          node --test v2/tests/interaction-anchors.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local kitchen
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hanna-r15.log 2>&1 &
          for n in {1..30}; do curl -fsS http://127.0.0.1:8765/v2/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test reach and real breakfast object transfer
        run: node --test v2/tests/contacts.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanna-r15-fridge-milk-table-evidence
          path: artifacts/hanna-r15-contact/
          retention-days: 30
          if-no-files-found: warn
